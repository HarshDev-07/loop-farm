<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loop Farm</title>
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <span class="wordmark">Loop Farm</span>
    <nav class="level-trail" id="level-trail" aria-label="Level progress"></nav>
    <div class="coin-counter" id="coin-counter" aria-live="polite" aria-label="Coins">
      <svg class="coin-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="8" fill="var(--sunflower)"/>
        <circle cx="9" cy="9" r="6" fill="none" stroke="#b08d1a" stroke-width="1.5"/>
      </svg>
      <span id="coin-count">0</span>
    </div>
  </header>

  <main class="layout">
    <!-- Left: Meadow Stage -->
    <section class="stage" aria-label="Farm stage">
      <div class="canvas-wrap">
        <canvas id="farm-canvas"></canvas>
        <p class="visually-hidden" id="canvas-description" aria-live="polite">
          Farm loaded. Press Run to start.
        </p>
      </div>
      <div class="level-info">
        <h1 class="level-title" id="level-title">Loop Farm</h1>
        <p class="level-story" id="level-story"></p>
        <p class="level-goal" id="level-goal"></p>
      </div>
    </section>

    <!-- Right: Editor Panel -->
    <aside class="editor-panel" aria-label="Code editor">
      <div class="editor-header">
        <span class="file-name">farm.js</span>
        <div class="editor-actions">
          <button class="btn-quiet" id="btn-restore" title="Restore starter code">Restore starter code</button>
        </div>
      </div>
      <div class="editor-wrap" id="editor-wrap"></div>
      <div class="run-bar">
        <button class="btn-run" id="btn-run" aria-label="Run code (Ctrl+Enter)">Run</button>
        <div class="speed-control" role="group" aria-label="Animation speed">
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn" data-speed="2">2×</button>
          <button class="speed-btn" data-speed="4">4×</button>
          <button class="speed-btn" data-speed="0">Instant</button>
        </div>
        <button class="btn-quiet btn-mute" id="btn-mute" aria-label="Toggle sound">Sound on</button>
      </div>
      <div class="divider"></div>
      <div class="message-area" id="message-area" role="status" aria-live="polite" aria-atomic="true">
        <div class="message neutral">
          <svg class="msg-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7" stroke="var(--slate-line)" stroke-width="1.5" fill="none"/>
            <line x1="8" y1="5" x2="8" y2="9" stroke="var(--slate-line)" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="11" r="1" fill="var(--slate-line)"/>
          </svg>
          <span>Write code, then press Run (Ctrl+Enter).</span>
        </div>
      </div>
      <div class="divider"></div>
      <details class="api-panel" id="api-panel">
        <summary class="api-summary">Functions you can use</summary>
        <ul class="api-list" id="api-list"></ul>
      </details>
      <div class="divider"></div>
      <div class="hint-area" id="hint-area">
        <button class="btn-quiet" id="btn-hint">Hint</button>
        <span class="hint-text" id="hint-text" hidden></span>
      </div>
      <div class="editor-footer">
        <button class="btn-quiet btn-reset" id="btn-reset-field">Reset field</button>
      </div>
    </aside>
  </main>

  <!-- Level complete modal -->
  <div class="modal-backdrop" id="modal-backdrop" hidden aria-modal="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal">
      <h2 class="modal-title" id="modal-title">Level complete</h2>
      <div class="stars-row" id="stars-row" aria-label="Stars earned"></div>
      <p class="modal-detail" id="modal-detail"></p>
      <div class="modal-actions">
        <button class="btn-run" id="btn-next-level">Next level</button>
        <button class="btn-quiet" id="btn-improve">Improve this level</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <button class="btn-quiet btn-danger" id="btn-reset-progress">Reset all progress</button>
  </footer>

  <!-- Run tip (shown once) -->
  <div class="run-tip" id="run-tip" hidden>
    Write code, then press Run (Ctrl+Enter).
    <button class="btn-quiet tip-dismiss" id="tip-dismiss" aria-label="Dismiss tip">×</button>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
